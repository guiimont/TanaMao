<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tá na Mão!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=20260807-4">
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-app);
    }

    .login-shell {
      width: min(100%, 430px);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .brand-panel {
      background: linear-gradient(135deg, var(--verde-dark) 0%, var(--verde-primary) 100%);
      padding: 36px 28px 28px;
      color: #fff;
      text-align: center;
      position: relative;
    }

    .brand-panel img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      display: block;
      margin: 0 auto 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.15);
      padding: 6px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-panel h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-panel p {
      margin-top: 6px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
    }

    .panel-body { 
      padding: 32px 28px; 
    }

    .form-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--verde-dark);
    }

    .form-copy {
      margin: 4px 0 22px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel">
      <img src="/TanaMao_Logo.jpg" alt="Tá na Mão!" onerror="this.src='https://storage.googleapis.com/app-tess-ai-platform-assets-prod/assets/uploads/5681b1bf-2661-4360-9c01-6141cd6ff531.png'">
      <div class="micro-heading gold" style="color: var(--dourado-primary);">ERP & OPERACIONAL</div>
      <h1>Painel Tá na Mão!</h1>
      <p>Alimentação Inteligente & Gestão Saudável</p>
    </section>

    <section class="panel-body" id="login-panel">
      <h2 class="form-title">Acessar a Plataforma</h2>
      <p class="form-copy">Insira suas credenciais cadastradas para continuar.</p>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">Senha</label>
          <input type="password" class="form-control" id="senha" name="password" placeholder="Sua senha de acesso" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" type="submit" id="btn-login">
          Entrar no Sistema
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <button class="btn btn-ghost btn-sm" type="button" id="show-reset">Esqueci minha senha</button>
      </div>
    </section>

    <section class="panel-body hidden" id="reset-panel">
      <h2 class="form-title">Recuperar Senha</h2>
      <p class="form-copy">Informe seu e-mail para enviarmos o link de redefinição de senha.</p>

      <form id="resetRequestForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="reset-email">E-mail cadastrado</label>
          <input type="email" class="form-control" id="reset-email" name="email" placeholder="seuemail@exemplo.com" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <button class="btn btn-gold btn-lg" style="width: 100%; margin-top: 10px;" type="submit" id="btn-reset">
          Enviar Link de Recuperação
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <button class="btn btn-ghost btn-sm" type="button" id="back-login">Voltar para o Login</button>
      </div>
    </section>
  </main>

  <script src="/assets/js/toast.js"></script>
  <script>
    const API = 'https://tanamao-backend.onrender.com/api';

    const loginPanel = document.getElementById('login-panel');
    const resetPanel = document.getElementById('reset-panel');
    const emailInput = document.getElementById('email');
    const resetEmailInput = document.getElementById('reset-email');

    document.getElementById('show-reset').addEventListener('click', () => {
      resetEmailInput.value = emailInput.value;
      loginPanel.classList.add('hidden');
      resetPanel.classList.remove('hidden');
      resetEmailInput.focus();
    });

    document.getElementById('back-login').addEventListener('click', () => {
      resetPanel.classList.add('hidden');
      loginPanel.classList.remove('hidden');
      emailInput.focus();
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');

      // Limpa dados antigos de sessão
      localStorage.removeItem('tnm_token');
      localStorage.removeItem('token');
      localStorage.removeItem('tnm_user');
      localStorage.removeItem('tnm_role');

      btn.disabled = true;
      btn.textContent = 'Autenticando...';

      // Alerta de inicialização para o Render (Cold Start)
      const slowTimer = setTimeout(() => {
        btn.textContent = 'Conectando ao servidor (Render)...';
        Toast.info('O servidor está iniciando. Isso pode levar alguns segundos na primeira conexão.');
      }, 3000);

      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value,
            password: document.getElementById('senha').value
          })
        });

        clearTimeout(slowTimer);
        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.message || 'Credenciais inválidas. Verifique seu e-mail e senha.');
        }

        localStorage.setItem('tnm_token', data.token);
        localStorage.setItem('tnm_user', JSON.stringify(data.user));
        if (data.user && data.user.role) localStorage.setItem('tnm_role', data.user.role);
        
        Toast.success('Login efetuado com sucesso! Redirecionando...');
        setTimeout(() => {
          window.location.href = 'painel.html';
        }, 800);
      } catch (err) {
        clearTimeout(slowTimer);
        let msg = err.message || 'Não foi possível realizar o login.';
        if (msg.includes('Failed to fetch')) {
          msg = 'Erro de conexão com a API backend (Render). Verifique se o servidor está ativo ou tente novamente.';
        }
        Toast.error(msg);
        btn.disabled = false;
        btn.textContent = 'Entrar no Sistema';
      }
    });

    document.getElementById('resetRequestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-reset');

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res = await fetch(API + '/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: resetEmailInput.value })
        });

        const data = await res.json();
        if (!data.ok) throw new Error(data.message || 'Não foi possível solicitar a recuperação.');

        Toast.success(data.message || 'E-mail de recuperação enviado com sucesso!');
      } catch (err) {
        Toast.error(err.message || 'Falha ao solicitar recuperação.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar Link de Recuperação';
      }
    });
  </script>
</body>
</html>
