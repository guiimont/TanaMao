<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Tá na Mão!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=20260808-1">
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-app);
    }

    .reset-shell {
      width: min(100%, 430px);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .brand-panel {
      background: linear-gradient(135deg, var(--verde-dark) 0%, var(--verde-primary) 100%);
      padding: 36px 28px 28px;
      color: #fff;
      text-align: center;
    }

    .brand-panel img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      display: block;
      margin: 0 auto 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.15);
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-panel h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-panel p {
      margin-top: 6px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
    }

    .panel-body { padding: 32px 28px; }

    .form-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--verde-dark);
    }

    .form-copy {
      margin: 4px 0 22px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="reset-shell">
    <section class="brand-panel">
      <img src="/assets/brand/tana-mao-symbol.svg" alt="Tá na Mão!">
      <div class="micro-heading gold" style="color: var(--dourado-primary);">SEGURANÇA</div>
      <h1>Redefinir Senha</h1>
      <p>Crie uma nova credencial de acesso segura</p>
    </section>

    <section class="panel-body">
      <h2 class="form-title">Nova Senha</h2>
      <p class="form-copy">Digite uma senha com no mínimo 6 caracteres.</p>

      <form id="resetPasswordForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="new-password">Nova Senha</label>
          <input type="password" class="form-control" id="new-password" name="new_password" autocomplete="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirmar Nova Senha</label>
          <input type="password" class="form-control" id="confirm-password" name="confirm_password" autocomplete="new-password" required minlength="6" placeholder="Repita a senha">
        </div>

        <button class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" type="submit" id="btn-save">
          Salvar Nova Senha
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a class="btn btn-ghost btn-sm" id="login-link" href="login.html">Voltar para o Login</a>
      </div>
    </section>
  </main>

  <script src="/assets/js/toast.js"></script>
  <script>
    const API = 'https://tanamao-backend.onrender.com/api';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const form = document.getElementById('resetPasswordForm');

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      form.style.display = 'none';
      Toast.error('Link de recuperação inválido ou expirado. Solicite um novo link.');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btn-save');
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        Toast.error('A senha deve ter no mínimo 6 caracteres.');
        return;
      }

      if (newPassword !== confirmPassword) {
        Toast.error('As senhas não coincidem.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const res = await fetch(API + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();
        if (!data.ok) throw new Error(data.message || 'Não foi possível redefinir a senha.');

        form.reset();
        form.style.display = 'none';
        Toast.success(data.message || 'Senha redefinida com sucesso! Você já pode entrar.');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } catch (err) {
        Toast.error(err.message || 'Erro ao redefinir a senha.');
        btn.disabled = false;
        btn.textContent = 'Salvar Nova Senha';
      }
    });
  </script>
</body>
</html>
