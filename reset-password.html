<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha - Tá na Mão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --green: #0f7a4a;
      --green-dark: #0b5f3a;
      --ink: #1f2933;
      --muted: #697586;
      --line: #d9e2dc;
      --paper: #fffaf1;
      --surface: #ffffff;
      --danger: #b42318;
      --success: #087443;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Poppins", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(15, 122, 74, 0.12), rgba(196, 154, 74, 0.12)),
        var(--paper);
    }

    .reset-shell {
      width: min(100%, 420px);
      background: var(--surface);
      border: 1px solid rgba(15, 122, 74, 0.12);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(31, 41, 51, 0.12);
      overflow: hidden;
    }

    .brand-panel {
      background: var(--green);
      padding: 28px 28px 24px;
      color: #fff;
      text-align: center;
    }

    .brand-panel img {
      width: 86px;
      height: 86px;
      object-fit: contain;
      display: block;
      margin: 0 auto 14px;
    }

    .brand-panel h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-panel p {
      margin: 8px 0 0;
      font-size: 0.92rem;
      color: rgba(255,255,255,0.82);
    }

    .panel-body { padding: 28px; }

    .form-title {
      margin: 0 0 6px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .form-copy {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 0.86rem;
      font-weight: 600;
      color: #334155;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      outline: none;
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(15, 122, 74, 0.14);
    }

    .primary-btn,
    .secondary-link {
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .primary-btn {
      border: 0;
      background: var(--green);
      color: #fff;
      transition: background .2s, transform .2s;
    }

    .primary-btn:hover { background: var(--green-dark); }
    .primary-btn:disabled { background: #98a2b3; cursor: wait; transform: none; }

    .secondary-link {
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      color: var(--green-dark);
      text-decoration: none;
      background: #fff;
    }

    .feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 13px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.45;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .feedback.error {
      display: block;
      color: var(--danger);
      background: #fff1f0;
      border-color: #fecdca;
    }

    .feedback.success {
      display: block;
      color: var(--success);
      background: #ecfdf3;
      border-color: #abefc6;
    }
  </style>
</head>
<body>
  <main class="reset-shell">
    <section class="brand-panel">
      <img src="https://storage.googleapis.com/app-tess-ai-platform-assets-prod/assets/uploads/5681b1bf-2661-4360-9c01-6141cd6ff531.png" alt="Tá na Mão">
      <h1>Nova senha</h1>
      <p>Crie uma nova senha para acessar o painel.</p>
    </section>

    <section class="panel-body">
      <h2 class="form-title">Redefinir acesso</h2>
      <p class="form-copy">Digite uma nova senha com pelo menos 6 caracteres.</p>

      <form id="resetPasswordForm" autocomplete="on">
        <label for="new-password">Nova senha</label>
        <input type="password" id="new-password" name="new_password" autocomplete="new-password" required minlength="6">

        <label for="confirm-password">Confirmar nova senha</label>
        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required minlength="6">

        <button class="primary-btn" type="submit" id="btn-save">Salvar nova senha</button>
        <div id="feedback" class="feedback" role="alert"></div>
      </form>

      <a class="secondary-link" id="login-link" href="login.html">Voltar para o login</a>
    </section>
  </main>

  <script>
    const API = 'https://tanamao-backend.onrender.com/api';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const form = document.getElementById('resetPasswordForm');
    const feedback = document.getElementById('feedback');
    const loginLink = document.getElementById('login-link');

    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = 'feedback ' + type;
    }

    function showLoginLink() {
      loginLink.style.display = 'flex';
    }

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      form.style.display = 'none';
      showFeedback('Link de recuperação inválido ou expirado. Solicite um novo link.', 'error');
      showLoginLink();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btn-save');
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        showFeedback('A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showFeedback('As senhas não conferem.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';
      feedback.className = 'feedback';
      feedback.textContent = '';

      try {
        const res = await fetch(API + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();
        if (!data.ok) throw new Error(data.message || 'Não foi possível atualizar a senha.');

        form.reset();
        form.style.display = 'none';
        showFeedback(data.message || 'Senha atualizada com sucesso.', 'success');
        showLoginLink();
      } catch (err) {
        showFeedback(err.message || 'Não foi possível atualizar a senha agora.', 'error');
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
      }
    });
  </script>
</body>
</html>
