<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão do Cardápio - Tá na Mão!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=20260808-1">
</head>
<body style="padding: 24px; max-width: 900px; margin: 0 auto;">

  <header style="margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div class="micro-heading gold">CADASTRO RÁPIDO</div>
      <h1 class="section-title">Gestão do Cardápio</h1>
    </div>
    <a href="/painel.html" class="btn btn-secondary btn-sm">Voltar ao Painel ERP</a>
  </header>

  <div class="mailfy-card featured-green" style="margin-bottom: 28px;">
    <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--verde-dark); margin-bottom: 16px;">Novo Produto</h3>
    
    <div class="form-group">
      <label class="form-label">Nome da Refeição / Kit</label>
      <input id="nome" class="form-control" placeholder="Ex: Frango Grelhado com Legumes">
    </div>

    <div class="form-group">
      <label class="form-label">Descrição Breve</label>
      <textarea id="desc" class="form-control" rows="3" placeholder="Ingredientes principais e detalhes"></textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="form-group">
        <label class="form-label">Preço (R$)</label>
        <input id="preco" type="number" step="0.01" class="form-control" placeholder="24.90">
      </div>
      <div class="form-group">
        <label class="form-label">Imagem da Refeição</label>
        <input id="img" type="file" accept="image/*" class="form-control">
      </div>
    </div>

    <button onclick="criar()" class="btn btn-primary" style="margin-top: 8px;">Salvar Produto</button>
  </div>

  <div class="micro-heading">CATÁLOGO CADASTRADO</div>
  <h2 class="section-title" style="margin-bottom: 16px;">Produtos no Cardápio</h2>
  
  <div id="lista" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;"></div>

  <script src="/assets/js/toast.js"></script>
  <script>
    const API = "https://tanamao-backend.onrender.com/api";

    function fileToBase64(file){
      return new Promise((res,rej)=>{
        const r=new FileReader();
        r.readAsDataURL(file);
        r.onload=()=>res(r.result);
        r.onerror=rej;
      });
    }

    async function criar(){
      const name = document.getElementById("nome").value;
      const description = document.getElementById("desc").value;
      const price = document.getElementById("preco").value;
      const file = document.getElementById("img").files[0];

      if(!name || !price) {
        Toast.error("Por favor, preencha o nome e o preço.");
        return;
      }

      let image_url = "";
      if(file){
        image_url = await fileToBase64(file);
      }

      try {
        const res = await fetch(API+"/products",{
          method:"POST",
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name,description,price,image_url})
        });

        const data = await res.json();
        if(!data.ok) throw new Error(data.message || "Erro ao salvar");

        Toast.success("Produto cadastrado com sucesso!");
        document.getElementById("nome").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("preco").value = "";
        document.getElementById("img").value = "";
        carregar();
      } catch(e) {
        Toast.error(e.message || "Falha ao salvar produto.");
      }
    }

    async function carregar(){
      try {
        const res = await fetch(API+"/products");
        const data = await res.json();

        const el = document.getElementById("lista");
        el.innerHTML="";

        if (!data.products || data.products.length === 0) {
          el.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">Nenhum produto cadastrado ainda.</div>';
          return;
        }

        data.products.forEach(p=>{
          el.innerHTML += `
            <div class="mailfy-card">
              ${p.image_url ? `<img src="${p.image_url}" style="width:100%; height:140px; object-fit:cover; border-radius:var(--radius-sm); margin-bottom:12px;">` : ""}
              <h4 style="font-weight:800; color:var(--verde-dark); font-size:1rem; margin-bottom:4px;">${p.name}</h4>
              <p style="color:var(--text-muted); font-size:0.82rem; margin-bottom:10px;">${p.description || 'Sem descrição'}</p>
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <span style="font-weight:800; color:var(--dourado-dark); font-size:1.1rem;">R$ ${Number(p.price).toFixed(2)}</span>
                <button onclick="del('${p.id}')" class="btn btn-ghost btn-sm" style="color:var(--status-danger-text);">Excluir</button>
              </div>
            </div>
          `;
        });
      } catch(e) {
        Toast.error("Erro ao carregar lista de produtos.");
      }
    }

    async function del(id){
      if(confirm("Deseja realmente excluir este produto?")) {
        await fetch(API+"/products/"+id,{method:"DELETE"});
        Toast.info("Produto removido.");
        carregar();
      }
    }

    carregar();
  </script>

</body>
</html>
